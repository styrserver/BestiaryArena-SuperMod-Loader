# Release = push a commit to main that changes the version in manifest.json.
# That builds both store zips and uploads them to the Chrome Web Store and Firefox AMO.
#
#   1. Bump "version" in manifest.json and manifest_firefox.json, add the docs/patch-notes.json entry.
#   2. Commit and push to main. Done.
#
# Manual runs (Actions tab -> Release -> Run workflow): leave "publish" off for a dry run (builds the
# zips, checks the Chrome login, uploads nothing); turn it on to release the current version again.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_PUBLISHER_ID   Chrome Web Store
#   AMO_JWT_ISSUER, AMO_JWT_SECRET                                          Firefox AMO
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to both stores (off = dry run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide whether this is a release
        id: ver
        run: |
          NEW=$(node -p "require('./manifest.json').version")
          OLD=$(git show HEAD^:manifest.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo none)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then RELEASE=${{ inputs.publish }}
          elif [ "$NEW" != "$OLD" ]; then RELEASE=true
          else RELEASE=false; fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version $OLD -> $NEW, release=$RELEASE"
      - name: Build zips (also runs the patch-notes check)
        run: node tools/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: store-zips
          path: dist/*.zip
          if-no-files-found: error

  chrome:
    needs: build
    runs-on: ubuntu-latest
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: needs.build.outputs.release != 'true'
        name: Dry run - check the Chrome login only
        run: node tools/cws.mjs status
      - if: needs.build.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: store-zips
          path: dist
      - if: needs.build.outputs.release == 'true'
        name: Upload and publish to the Chrome Web Store
        run: node tools/cws.mjs publish "dist/chrome-${{ needs.build.outputs.version }}.zip"

  firefox:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: store-zips
          path: dist
      - name: Submit a new listed version to AMO
        run: |
          unzip -q "dist/firefox-${{ needs.build.outputs.version }}.zip" -d dist/firefox
          npx --yes web-ext@8 sign --source-dir dist/firefox --channel listed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
